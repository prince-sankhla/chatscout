name: Harvest InstaGroups Public Inventory

on:
  push:
    paths:
      - ".github/workflows/harvest-instagroups.yml"

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch competitor public feed
        env:
          HARVEST_PAGES: "8"
          PAGE_SIZE: "250"
        run: |
          python - <<'PY'
          import json, os, re, subprocess, requests, time

          APP_URL = "https://huggingface.co/spaces/frtarun/Instagroups/raw/main/static/app.js"
          app = requests.get(APP_URL, timeout=20)
          app.raise_for_status()

          rest = re.search(r'SUPABASE_REST_URL\s*=\s*["\']([^"\']+)["\']', app.text)
          key = re.search(r'SUPABASE_ANON_KEY\s*=\s*["\']([^"\']+)["\']', app.text)
          if not rest or not key:
              raise SystemExit("Could not locate public competitor API config")

          rest_url = rest.group(1).rstrip("/")
          anon_key = key.group(1)
          host = re.sub(r"^https?://", "", rest_url).split("/",1)[0]

          dns = requests.get(
              "https://dns.google/resolve",
              params={"name": host, "type": "A"},
              timeout=10,
          )
          dns.raise_for_status()
          answers = [x["data"] for x in dns.json().get("Answer", []) if x.get("type") == 1]
          if not answers:
              raise SystemExit(f"No A records returned for {host}")

          def fetch_page(offset):
              params = (
                  "select=id%2Cname%2Ctoken%2Ctype_id%2Ccategory%2Csource%2Cimage_url%2Cmembers_count"
                  f"&order=id.desc&limit={int(os.environ['PAGE_SIZE'])}&offset={offset}&type_id=eq.0"
              )
              url = f"{rest_url}/groups?{params}"
              ip = answers[offset // int(os.environ["PAGE_SIZE"]) % len(answers)]
              cmd = [
                  "curl","--silent","--show-error","--fail","--location",
                  "--connect-timeout","10","--max-time","25",
                  "--resolve",f"{host}:443:{ip}",
                  "-H",f"apikey: {anon_key}",
                  "-H",f"Authorization: Bearer {anon_key}",
                  "-H","Accept: application/json",
                  url,
              ]
              p = subprocess.run(cmd, capture_output=True, text=True)
              if p.returncode != 0:
                  raise RuntimeError(p.stderr.strip() or "curl failed")
              return json.loads(p.stdout)

          rows = []
          for page in range(int(os.environ["HARVEST_PAGES"])):
              batch = fetch_page(page * int(os.environ["PAGE_SIZE"]))
              if not batch:
                  break
              rows.extend(batch)
              time.sleep(0.25)

          dedup = {}
          for r in rows:
              token = str(r.get("token") or "").strip()
              if re.fullmatch(r"[A-Za-z0-9_-]+", token):
                  dedup[token] = r

          payload = {
              "source": "InstaGroups public frontend/public REST feed",
              "generated_at": __import__("datetime").datetime.utcnow().isoformat() + "Z",
              "source_rows": len(rows),
              "unique_tokens": len(dedup),
              "rows": list(dedup.values()),
          }

          os.makedirs("data", exist_ok=True)
          with open("data/instagroups-public-export.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))

          print(json.dumps({
              "source_rows": payload["source_rows"],
              "unique_tokens": payload["unique_tokens"]
          }))
          PY

      - name: Commit harvested export
        run: |
          git config user.name "ChatScout Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagroups-public-export.json
          git diff --cached --quiet || git commit -m "chore: refresh public InstaGroups export"
          git push
